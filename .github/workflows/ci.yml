name: CI

# This repository stopped being only a configuration some time ago: lua/ now
# holds modules that handle secrets and run infrastructure commands. CI is
# split accordingly — a smoke test that Neovim still starts, and a real test
# suite for the logic where being wrong is expensive.
#
# Actions are pinned to full commit SHAs rather than tags. A tag is a moving
# pointer that the action's owner can repoint at any time, which makes it a
# credential-shaped hole in any workflow that touches a token. GitHub documents
# the SHA as the only immutable form. The readable version is kept in a comment
# so the pin can be audited without a lookup.
#
# NTBBloodbath/selene-action is not used: its last release is from 2021. selene
# is fetched from its own release archive at a fixed version instead.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A push that supersedes another one on the same ref makes the earlier run
# uninteresting, and the startup job is now ten real installations rather than
# one. Cancelled only for pull requests, though: on main every commit is a
# candidate for a release, and a run cancelled halfway leaves that commit with
# no answer at all — which is the state this project keeps CI green to avoid.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned so a formatting or lint release cannot turn a green branch red
  # without a commit here. Raise them deliberately.
  STYLUA_VERSION: 2.5.2
  SELENE_VERSION: 0.31.0
  # SHA-256 of selene-${SELENE_VERSION}-linux.zip, checked before the binary is
  # run. A version pin says which release was asked for; it does not say the
  # bytes are the ones that release had when it was pinned, and a release asset
  # can be replaced. These two lines belong to each other: change the version
  # and the sum changes with it, in the same commit, from a download made on
  # purpose rather than from memory.
  SELENE_SHA256: dac452422747999ec4919bbb8bb52992b66aae533b60022bf005669de8616671
  # This file is now four hundred lines of shell, expressions and embedded Lua,
  # and nothing checked it. Pinned and summed for the same reason selene is: a
  # release asset can be replaced, and a version pin says which release was
  # asked for, not which bytes it had. Both lines change together, from a
  # download made on purpose. The version matches the actionlint this
  # configuration installs through Mason, so the workflow is linted by the tool
  # the editor would use on it.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  TREE_SITTER_VERSION: 0.26.9
  # The tests drive the real ansible-vault, and its behaviour is what several
  # of them assert on — which header a rekey writes, how --vault-id composes
  # with ansible.cfg. Pinned to the series those answers were verified against
  # rather than taken from whatever the runner image happens to ship.
  ANSIBLE_CORE_VERSION: 2.21.*
  # The version this configuration targets. `stable` is deliberately not used:
  # this config requires the 0.12 LSP API and the rewritten nvim-treesitter, so
  # a silent major bump should fail here rather than on somebody's machine.
  NEOVIM_VERSION: v0.12.4

jobs:
  lua:
    name: Formatting and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: stylua
        uses: JohnnyMorganz/stylua-action@76fd70c03e6340ceaf673366712db9b20560b402 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: --check .

      - name: Install selene
        run: |
          set -euo pipefail
          curl -fsSL -o selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          # Verified before it is unpacked, let alone run. Everything else in
          # this workflow is pinned by SHA for the same reason; this was the one
          # downloaded artefact still trusted on its filename alone.
          echo "${SELENE_SHA256}  selene.zip" | sha256sum -c -
          unzip -q selene.zip
          chmod +x selene
          sudo mv selene /usr/local/bin/

      - name: selene
        run: selene .

      - name: Install actionlint
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          sudo mv actionlint /usr/local/bin/

      - name: actionlint
        # The runner has shellcheck, and actionlint hands it every `run:` block,
        # so this checks the shell in the workflow as well as the workflow.
        run: actionlint

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ env.NEOVIM_VERSION }}

      - name: Install ansible-core
        # The integration tests drive the real ansible-vault CLI. Without it
        # they skip, which would quietly remove the regression cover for every
        # defect they were written for.
        #
        # From pip at a pinned series rather than from the distribution, which
        # ships whatever the image was built with. Several cases assert on
        # ansible's own behaviour — that a rekey to `label@source` writes a 1.2
        # header carrying the label, that --vault-id adds to the identity list
        # from ansible.cfg instead of replacing it — and those answers were
        # established against 2.21. A silent move to another series should fail
        # here, deliberately, rather than change what the suite is testing.
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install --quiet "ansible-core==${ANSIBLE_CORE_VERSION}"
          # Ahead of anything the image already has, so the tests cannot pick up
          # a system ansible-vault instead of the pinned one.
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Ansible versions
        # Diagnostic, not a check: when a case fails on ansible's behaviour, the
        # first question is which ansible answered.
        run: |
          set -euo pipefail
          command -v ansible-vault
          ansible --version
          ansible-vault --version

      - name: Fetch mini.test
        # The suite needs nothing else to run: tests/minimal_init.lua loads this
        # repository's lua/ directory and mini.test, not the configuration.
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json; print(json.load(open('lazy-lock.json'))['mini.test']['commit'])")
          target="${HOME}/.local/share/nvim/lazy/mini.test"
          git clone --filter=blob:none https://github.com/nvim-mini/mini.test "$target"
          git -C "$target" checkout --quiet "$commit"

      - name: Fetch conform.nvim
        # Not to run the formatting tests — those stub conform — but for the one
        # case that checks the stub is not lying: that `terraform_fmt` and
        # `tofu_fmt` are formatters the pinned conform actually ships. It reads
        # the installed plugin, and skipped itself when nothing was installed,
        # which is precisely when a rename upstream would go unnoticed.
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json; print(json.load(open('lazy-lock.json'))['conform.nvim']['commit'])")
          target="${HOME}/.local/share/nvim/lazy/conform.nvim"
          git clone --filter=blob:none https://github.com/stevearc/conform.nvim "$target"
          git -C "$target" checkout --quiet "$commit"

      - name: Fetch gitsigns.nvim
        # For the case that stages a decrypted vault and checks the git index.
        # Staging writes `.git/index` rather than the working tree, so it is the
        # one path to disk that none of the vault write guards can see; the test
        # reads the shipped on_attach, and skips itself when the plugin is absent.
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json; print(json.load(open('lazy-lock.json'))['gitsigns.nvim']['commit'])")
          target="${HOME}/.local/share/nvim/lazy/gitsigns.nvim"
          git clone --filter=blob:none https://github.com/lewis6991/gitsigns.nvim "$target"
          git -C "$target" checkout --quiet "$commit"

      - name: Run tests
        run: |
          set -euo pipefail
          nvim --headless --noplugin -u tests/minimal_init.lua \
            -c "lua MiniTest.run()" -c "qa!" 2>&1 | tee result.txt
          # MiniTest reports failures in its summary rather than through the
          # exit code, so the summary is what decides this job — and it decides
          # it by being there and saying zero.
          #
          # Looking for `Fails ([1-9]` instead was a job that passed whenever
          # the summary was absent: a crash before it printed, a runner that
          # died partway, an empty result.txt, a suite that collected nothing,
          # or a future MiniTest that words its summary differently. All of
          # those are failures, and all of them read as success.
          if ! grep -q 'Fails (0)' result.txt; then
            echo "::error::MiniTest did not report a clean result"
            exit 1
          fi

  startup:
    name: Neovim starts clean
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1.6.1
        with:
          neovim: true
          version: ${{ env.NEOVIM_VERSION }}

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          # unzip and gzip are what Mason unpacks its packages with, and this is
          # the job that boots the real configuration. They are in README's
          # requirements and in `:checkhealth chroma`; installing them here
          # keeps the three saying the same thing.
          sudo apt-get install -y --no-install-recommends \
            build-essential curl tar unzip gzip ripgrep fd-find
          # Upstream is explicit that the npm build is not supported.
          cargo install tree-sitter-cli --locked --version "${TREE_SITTER_VERSION}"

      - name: Cold start, once per profile
        # Five real installations, not five unit tests.
        #
        # Until this loop existed, every cold start CI ever did was the legacy
        # one: no selection, so every component enabled. That is the shape least
        # likely to break, because it is the shape the configuration had before
        # any of this. The ones worth proving are the others — `"selected": []`
        # loading an editor with no DevOps layer at all, and a single component
        # bringing exactly its own servers, parsers and plugins through a real
        # `Lazy! sync` rather than through a resolver a test asked politely.
        #
        # One job with a loop rather than a matrix, deliberately: the tree-sitter
        # CLI above is a Rust build of several minutes, and a matrix would pay
        # for it once per profile. Each iteration still gets its own
        # XDG_CONFIG_HOME and XDG_DATA_HOME, so plugins, Mason and parsers are
        # installed from nothing every time. The ::group:: markers keep the log
        # readable, and every message names the profile it came from.
        #
        # All four XDG directories, not two: config and data are the obvious
        # ones, and the cache is the one whose absence went unnoticed until the
        # loop grew from five profiles to ten.
        run: |
          set -euo pipefail

          for profile in legacy core-only terraform kubernetes helm ansible vault aws docker github-actions; do
            echo "::group::cold start — $profile"

            config="$GITHUB_WORKSPACE/.ci/$profile/config"
            data="$GITHUB_WORKSPACE/.ci/$profile/data"
            state="$GITHUB_WORKSPACE/.ci/$profile/state"
            cache="$GITHUB_WORKSPACE/.ci/$profile/cache"
            mkdir -p "$config" "$data" "$state" "$cache"
            ln -s "$GITHUB_WORKSPACE" "$config/nvim"

            # legacy is the absence of the file, which is not the same document
            # as an empty selection and must not be written as one.
            case "$profile" in
              legacy)    ;;
              core-only) selected='[]' ;;
              *)         selected="[\"$profile\"]" ;;
            esac
            if [ "$profile" != legacy ]; then
              mkdir -p "$config/chroma"
              printf '{ "schema": 1, "selected": %s }\n' "$selected" > "$config/chroma/components.json"
            fi

            export XDG_CONFIG_HOME="$config"
            export XDG_DATA_HOME="$data"
            export XDG_STATE_HOME="$state"
            # The cache as well, and this one is not tidiness. nvim-treesitter
            # does its download and build scratch under XDG_CACHE_HOME, and
            # leaving that shared meant one profile's cleanup raced the previous
            # profile's still-finishing jobs — `rm: cannot remove ...: Directory
            # not empty`, which failed the job. With one profile that never
            # showed; with ten it was a matter of time.
            export XDG_CACHE_HOME="$cache"

            # Plugins and parsers in one Neovim, on purpose.
            #
            # They used to be two invocations with an `rm -rf` of the treesitter
            # scratch between them, and that removal raced the first one:
            # `Lazy! sync` starts parser installs asynchronously, `+qa` ends the
            # editor while they are still writing, and the shell then deleted a
            # directory a live process was filling — `rm: cannot remove
            # .../tree-sitter-hcl: Directory not empty`, which failed the job.
            # Giving each profile its own cache did not help, because the race
            # was never between profiles; it was between a step and the step
            # before it.
            #
            # In one process there is nothing to kill and nothing to clean up
            # between: the sync completes, and only then does the parser install
            # start. It is also closer to what the installer itself does.
            nvim --headless -c 'lua
              -- The pinned set, not the latest one: `sync` updates every
              -- plugin to the head of its branch, which is neither what a
              -- release installs nor what this repository pins a lockfile for.
              require("lazy").install({ wait = true, show = false, lockfile = true })
              require("lazy").restore({ wait = true, show = false })

              local wanted = require("config.parsers")
              local function missing()
                local installed = {}
                for _, name in ipairs(require("nvim-treesitter.config").get_installed("parsers")) do
                  installed[name] = true
                end
                local absent = {}
                for _, name in ipairs(wanted) do
                  if not installed[name] then table.insert(absent, name) end
                end
                return absent
              end

              require("nvim-treesitter").install(wanted)

              -- Polled rather than awaited. The task install() returns comes back
              -- while its per-parser jobs are still running — measured: the check
              -- reported one missing while the log was still installing others.
              -- vim.wait drives the event loop, so the downloads make progress.
              vim.wait(900000, function() return #missing() == 0 end, 500)

              local absent = missing()
              if #absent > 0 then
                io.write("parsers still missing: " .. table.concat(absent, ", ") .. "\n")
                vim.cmd("cquit 1")
              end
              io.write("All parsers installed.\n")
            ' -c 'qa!'

            out=$(nvim --headless -c 'lua io.write(vim.fn.execute("messages"))' -c 'qa!' 2>&1)
            if [ -n "$out" ]; then
              echo "::error::Neovim produced output on startup with profile $profile"
              echo "$out"
              exit 1
            fi

            nvim --headless -c 'lua
              local failed = {}
              for name, _ in vim.fs.dir("lua/plugins") do
                local mod = "plugins." .. name:gsub("%.lua$", "")
                local ok, err = pcall(require, mod)
                if not ok then table.insert(failed, mod .. ": " .. tostring(err)) end
              end
              for _, mod in ipairs({ "chroma-vault", "chroma-terraform", "chroma-aws", "chroma.health" }) do
                local ok, err = pcall(require, mod)
                if not ok then table.insert(failed, mod .. ": " .. tostring(err)) end
              end
              if #failed > 0 then
                io.write(table.concat(failed, "\n") .. "\n")
                vim.cmd("cquit 1")
              end
              io.write("All modules load.\n")
            ' -c 'qa!'

            # What the profile actually resolved to, checked against the file
            # that was written rather than against the resolver's own opinion.
            nvim --headless -c "lua
              local state = require('chroma.state')
              local ids, mode = state.enabled_ids()
              local expected = '$profile'
              io.write(('%s → %s (%s)\n'):format(expected, table.concat(ids, ' '), mode))

              local wrong = nil
              if expected == 'legacy' then
                if mode ~= state.LEGACY then wrong = 'expected legacy mode' end
              elseif expected == 'core-only' then
                if mode ~= state.SELECTED or #ids ~= 1 or ids[1] ~= 'core' then
                  wrong = 'expected core alone'
                end
              else
                if mode ~= state.SELECTED or not vim.tbl_contains(ids, expected) then
                  wrong = 'expected ' .. expected .. ' to be enabled'
                end
                if #ids ~= 2 then wrong = 'expected core and ' .. expected .. ' only' end
              end

              if wrong then
                io.write(wrong .. '\n')
                vim.cmd('cquit 1')
              end
            " -c 'qa!'

            echo "::endgroup::"
          done

          echo "Every profile installed and started clean."

      # The other half of the selection contract, and the only startup that is
      # allowed to say something: a file that exists and cannot be read starts
      # the editor with core alone rather than with everything.
      - name: A broken selection starts, says so, and runs core alone
        run: |
          set -euo pipefail

          config="$GITHUB_WORKSPACE/.ci/broken/config"
          mkdir -p "$config/chroma"
          ln -s "$GITHUB_WORKSPACE" "$config/nvim"
          printf '{ "schema": 1, "selected": ["magic"] }\n' > "$config/chroma/components.json"

          # The plugins and parsers of the legacy profile, so this measures the
          # selection and not a missing installation.
          export XDG_CONFIG_HOME="$config"
          export XDG_DATA_HOME="$GITHUB_WORKSPACE/.ci/legacy/data"

          nvim --headless -c 'lua
            local state = require("chroma.state")
            local ids, mode = state.enabled_ids()
            if mode ~= state.SAFE or #ids ~= 1 or ids[1] ~= "core" then
              io.write(("expected safe mode with core alone, got %s: %s\n"):format(mode, table.concat(ids, " ")))
              vim.cmd("cquit 1")
            end

            local said = vim.fn.execute("messages")
            if not said:find("unknown component", 1, true) then
              io.write("the editor did not say what was wrong with the file\n")
              vim.cmd("cquit 1")
            end
            io.write("Safe mode: core alone, and it said why.\n")
          ' -c 'qa!'

      - name: Help tags are current
        env:
          XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/legacy/config
        run: |
          set -euo pipefail
          nvim --headless -c 'helptags doc' -c 'qa!'
          if ! git diff --quiet -- doc/tags; then
            echo "doc/tags is out of date. Run :helptags doc and commit the result."
            git --no-pager diff -- doc/tags
            exit 1
          fi
          echo "Help tags are current."

      - name: Lockfile is valid JSON
        run: python3 -c "import json; json.load(open('lazy-lock.json'))"

  cli-lint:
    name: CLI formatting and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          # No cache-dependency-path: the module has no external dependencies,
          # so there is no go.sum to point at and naming one produces a warning
          # on every run for a cache that would hold nothing.
          cache: false

      - name: gofmt
        # `gofmt -l` prints what it would change and exits 0 either way, so the
        # output is the check.
        run: |
          set -euo pipefail
          cd cli
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd: $unformatted"
            exit 1
          fi
          echo "gofmt clean."

      - name: go vet
        run: cd cli && go vet ./...

  cli-test:
    name: CLI test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          # No cache-dependency-path: the module has no external dependencies,
          # so there is no go.sum to point at and naming one produces a warning
          # on every run for a cache that would hold nothing.
          cache: false

      # These read ../../../components, so they check the contract this
      # repository ships as well as the reader. A component that does not
      # resolve fails the build rather than an install on somebody's machine.
      - name: go test
        run: cd cli && go test ./...

  cli-build:
    name: CLI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          # No cache-dependency-path: the module has no external dependencies,
          # so there is no go.sum to point at and naming one produces a warning
          # on every run for a cache that would hold nothing.
          cache: false

      # Cross-compiles only. Attaching binaries to a release is a separate step
      # that does not exist yet, and inventing it before there is anything to
      # install would be pretending.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: cd cli && go build -o /dev/null ./cmd/chroma
